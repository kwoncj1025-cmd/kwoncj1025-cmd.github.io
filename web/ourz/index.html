.cuts>img,.cuts>video{display:block;width:100%;height:auto;background:#242320}
.foot{margin-top:clamp(56px,9vh,96px);padding-top:16px;padding-bottom:clamp(72px,12vh,140px);border-top:1px solid var(--nt-line);margin-inline:var(--pad);padding-inline:0}
.foot .go{grid-column:3/-1;display:flex;justify-content:flex-end}

  .foot .go{justify-content:flex-start}

<script>
// 영상 컷은 화면 가까이 오면 포스터·소스를 붙이고(한 번만), 화면에 들어온 동안만 재생한다. 움직임 줄이기면 포스터만
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, hi = (devicePixelRatio || 1) * innerWidth > 1700;
  const arm = v => { if (v.dataset.armed) return; v.dataset.armed = '1'; v.poster = hi ? v.dataset.poster2x : v.dataset.poster; v.querySelectorAll('source').forEach(s => { s.src = s.dataset.src; }); v.load(); };
  const near = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { arm(e.target); near.unobserve(e.target); } }), { rootMargin: '100% 0px' });
  const seen = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.isIntersecting) { arm(v); if (!reduce) v.play().catch(() => {}); } else v.pause(); }));
  document.querySelectorAll('video').forEach(v => { near.observe(v); seen.observe(v); });
})();
</script>
